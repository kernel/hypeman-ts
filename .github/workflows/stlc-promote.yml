name: Promote SDKs

# Staging changes are promoted through one persistent production PR. Merge this
# PR with a merge commit so production and staging retain shared history.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'kernel/hypeman-ts-staging'
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: stlc-promote
      cancel-in-progress: true
    steps:
      - name: Check out staging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint production token
        id: production-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          owner: kernel
          repositories: hypeman-ts
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.production-token.outputs.token }}
          PRODUCTION_REPO: kernel/hypeman-ts
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production already has staging's content
        id: diff
        run: |
          MERGED=$(git merge-tree --write-tree production/main origin/main) || MERGED=conflict
          PRODUCTION_TREE=$(git rev-parse 'production/main^{tree}')
          if [ "$MERGED" = "$PRODUCTION_TREE" ]; then
            echo "Production already contains staging's content. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the production release branch
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ steps.production-token.outputs.token }}
          PRODUCTION_REPO: kernel/hypeman-ts
        run: git push production origin/main:refs/heads/stainless/release --force

      - name: Open or update the promotion PR
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ steps.production-token.outputs.token }}
          PRODUCTION_REPO: kernel/hypeman-ts
        run: |
          body=$(mktemp)
          git log --oneline production/main..origin/main > "$body"
          printf '\nMerge this PR with a merge commit. Do not squash or rebase.\n' >> "$body"

          existing=$(gh pr list --repo "$PRODUCTION_REPO" --head stainless/release \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            url=$(gh pr create --repo "$PRODUCTION_REPO" --base main \
              --head stainless/release --title "Release SDK updates" --body-file "$body")
          else
            gh pr edit "$existing" --repo "$PRODUCTION_REPO" \
              --title "Release SDK updates" --body-file "$body" >/dev/null
            url=$(gh pr view "$existing" --repo "$PRODUCTION_REPO" --json url --jq .url)
          fi
          echo "Review and merge with a merge commit: $url" >> "$GITHUB_STEP_SUMMARY"
